function chNick(){const v=($('ni').value||'').trim().replace(/\s+/g,' ');if(nkLeft())return toast('아직 변경할 수 없습니다');if(!NRE.test(v))return toast('2~10자, 한글·영문·숫자·_ 만 가능합니다');if(v==nick())return toast('현재 닉네임과 같습니다');try{localStorage.setItem(NK,JSON.stringify({n:v,t:Date.now()}))}catch(e){return toast('저장 실패')}lastUp='';upRank(true);toast('닉네임 변경 완료');mod('set')}

async function jf(u,o){const ct=new AbortController(),t=setTimeout(()=>ct.abort(),7000);try{const r=await fetch(u,Object.assign({signal:ct.signal},o));if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}

catch(e){let v=[2,4,6,9,12,16,21,27,34,42].map((s,i)=>({id:'bot'+i,s,k:s*37+13*i}));v.push({id:RID,s:S.stage,k:S.kills,n:nick()});v.sort((a,b)=>b.s-a.s||b.k-a.k);const r=v.findIndex(x=>x.id==RID)+1;h=`<h3>🏆 랭킹 <small>오프라인</small></h3><p style="color:#ffb86b">⚠ ${e.message=='cfg'?'온라인 서버 주소(RANK_URL)가 아직 설정되지 않았습니다.':'서버에 연결하지 못했습니다. 인터넷을 확인하고 새로고침하세요.'} 지금은 내 기록과 가상 사냥꾼(🤖)만 표시됩니다.</p><p>내 순위 ${r} / 전체 ${v.length}</p>`+v.map((x,i)=>x.id==RID?rkRow(i+1,x):`<div class="row"><span>${i+1}위 🤖 가상 사냥꾼</span><span>${x.s}단계 · ${fmt(x.k)}처치</span></div>`).join('')}

function setVol(k,v){S[k]=Math.min(1,Math.max(0,v/100));const e=$(k+'v');if(e)e.textContent=Math.round(S[k]*100)+'%';if(k=='bgm'&&MB)MB.vol.gain.value=.55*S.bgm;if(k=='sfx'&&sg)sg.gain.value=.25*S.sfx}
$('md').addEventListener('click',e=>{if(e.target===$('md'))mod()});addEventListener('keydown',e=>{if(e.key==='Escape')mod()});
setInterval(()=>{if(T>2)daily();hud();R()},300);hud();
(()=>{let el=Math.min((Date.now()-S.last)/1000,7200);if(el>60){let g=el*.2*gpk();S.gold+=g;setTimeout(()=>toast('오프라인 보상 💰'+fmt(g)),500)}})();
</script></body></html>
