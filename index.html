c.innerHTML=`<h3>🛡 ${esc(gd.n)} <small>🌐 온라인</small></h3><p>멤버 <b>${n}/30</b>명 → 공격력·골드 <b style="color:#ffd34d">+${Math.min(30,n)}%</b> · 길드 코드 <b style="user-select:text">${g}</b></p><p><button class="b" ${chk?'disabled':''} onclick="gCheck()">${chk?'📅 오늘 출석 완료 ✓':'📅 출석 💎500'}</button></p><h4>멤버</h4>`+list.map((x,i)=>`<div class="row" style="padding:8px 0"><span>${i+1}. ${x.id==gd.o?'👑 ':''}${esc(x.n)}${x.id==RID?' <small>(나)</small>':''}</span><span><small>${x.s}단계 · ${fmt(x.k)}처치</small></span></div>`).join('')+`<h4>💬 길드 채팅</h4><div id="gcl" style="max-height:150px;overflow:auto;background:#0d1230;border-radius:8px;padding:8px;font-size:15px">${msgs.length?msgs.map(m=>`<div><b>${esc(m.n)}</b>: ${esc(m.m)}</div>`).join(''):'<small>아직 대화가 없어요.</small>'}</div><p><input id="gci" maxlength="60" placeholder="메시지 (60자)" style="width:60%" onkeydown="if(event.key=='Enter')gSend()"> <button class="b" onclick="gSend()">보내기</button></p><p><button class="b" onclick="mod()">닫기</button> <button class="b" onclick="mod('gd')">새로고침</button> <button class="b" onclick="gLeave()">길드 탈퇴</button></p>`;
const e=$('gcl');if(e)e.scrollTop=1e9}
function gCheck(){if(!gId()||S.x.gc===DAYN())return;S.x.gc=DAYN();S.gems+=500;sfx('win');toast('📅 길드 출석 💎+500');save();hud();gShow(true)}
async function gSend(){const g=gId(),t=($('gci')&&$('gci').value||'').trim().slice(0,60);if(!g||!t)return;if(Date.now()-GSENT<3000)return toast('잠시 후 다시 보내주세요');GSENT=Date.now();
try{await jf(`${RANK_URL}/gc/${g}.json`,{method:'POST',body:JSON.stringify({n:nick(),m:t,ts:Date.now()})});gShow(true)}catch(e){toast('전송하지 못했습니다')}}
async function gLeave(){if(!GLV){GLV=1;toast('한 번 더 누르면 길드를 탈퇴합니다');setTimeout(()=>GLV=0,3000);return}GLV=0;const g=gId();if(!g)return;
try{await jf(`${RANK_URL}/gm/${g}/${RID}.json`,{method:'DELETE'});const rest=await jf(`${RANK_URL}/gm/${g}.json?shallow=true`);if(!rest||!Object.keys(rest).length){await jf(`${RANK_URL}/guilds/${g}.json`,{method:'DELETE'});await jf(`${RANK_URL}/gc/${g}.json`,{method:'DELETE'})}gSet('');gCnt(0);toast('길드를 탈퇴했습니다')}catch(e){toast('탈퇴하지 못했습니다')}mod('gd')}
{const _m=mod;mod=function(k){_m(k);if(k=='gd')gShow()}}

async function cloudBoot(){try{if(!RANK_URL||noSave)return;const r=await jf(`${RANK_URL}/saves/${ACC}.json`);if(r&&typeof r.d=='string'){const d=JSON.parse(r.d);if(d&&d.S&&d.S.v==2&&Number(d.S.last)>LAST0+9e4){PEND={code:ACC,d};mod('set');toast('☁ 다른 기기에 더 최신 저장이 있어요',3500);return}}}catch(e){}finally{CLOK=1;cloudUp(true)}}
var ACCT=0;
function accTog(){const e=$('accv');if(!e)return;if(e.dataset.s=='1'){e.dataset.s='';e.textContent='••••-••••-••••-••••'}else{e.dataset.s='1';e.textContent=fc(ACC);clearTimeout(ACCT);ACCT=setTimeout(()=>{const x=$('accv');if(x&&x.dataset.s=='1')accTog()},10000)}}
