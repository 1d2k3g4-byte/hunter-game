const ACH=[];ACG.forEach(([f,l,gs,rs])=>gs.forEach((g,i)=>ACH.push({f,l,g,r:rs[i]})));
const achOk=(a,i)=>!S.x.ac.includes(i)&&a.f()>=a.g;
function claim(i){const a=ACH[i];if(!a||!achOk(a,i))return;S.x.ac.push(i);S.gems+=a.r;sfx('win');toast('🏅 업적 보상 💎+'+a.r);R()}
function claimAll(){let g=0;ACH.forEach((a,i)=>{if(achOk(a,i)){S.x.ac.push(i);g+=a.r}});if(g){S.gems+=g;sfx('win');toast('🏅 업적 보상 💎+'+g)}R()}
function badge(){const n=ACH.some(achOk),e=$('mxb'),s=n?'<b>📖</b>도감 <span style="color:#f55">●</span>':'<b>📖</b>도감';if(e.dataset.s!=s){e.dataset.s=s;e.innerHTML=s}}
function codexH(){let h='<h3>📖 도감 · 🏅 업적</h3><p>'+[['m','👾 몬스터'],['i','🎒 장비'],['a','🏅 업적']].map(([k,l])=>tabB(k,l,'XT',XT)).join(' ')+'</p>';
h+=`<p>도감 수집 <b>${CXN}/${CXMAX}</b> → 공격력·골드 <b>+${CXN}%</b></p>`;
if(XT=='m'){NMS.forEach((nm,i)=>{const k=S.x.mk[i],t=MT.filter(v=>k>=v).length,nx=MT.find(v=>k<v);h+=`<div class="row"><span><b>${MI[i]} ${nm.join('/')}</b><br><small>처치 ${fmt(k)}${nx?' / 다음 ★ '+fmt(nx):' (완료)'}</small></span><span style="color:#ffd34d">${'★'.repeat(t)+'☆'.repeat(3-t)}</span></div>`})}
else if(XT=='i'){for(let i=0;i<3;i++){const t='wap'[i];h+=`<h4>${TY[t].i} ${TY[t].n}</h4><div style="display:flex;flex-wrap:wrap;gap:6px">`+GR.map((g,k)=>S.x.cx[i]>>k&1?`<span class="it" style="border-color:${col(k)};color:${col(k)};padding:6px 8px;font-size:13px">${g}<br>${TY[t].nm[k]}</span>`:`<span class="it" style="border-color:#444;color:#666;padding:6px 8px;font-size:13px">${g}<br>???</span>`).join('')+'</div>'}}
else{const un=ACH.filter(achOk).length;h+=`<p><button class="b" ${un?'':'disabled'} onclick="claimAll()">모두 받기 (${un})</button></p>`;ACH.forEach((a,i)=>{const done=S.x.ac.includes(i),v=a.f(),ok=!done&&v>=a.g,lbl=a.l.replace('{n}',fmt(a.g)).replace('{g}',GR[a.g]||'');h+=`<div class="row" style="${done?'opacity:.45':''}"><span><b>${lbl}</b><br><small>${a.l.includes('{g}')?'':fmt(Math.min(v,a.g))+' / '+fmt(a.g)+' · '}💎 ${a.r}</small></span><button class="b" ${ok?'':'disabled'} onclick="claim(${i})">${done?'완료 ✓':'받기'}</button></div>`})}
return h}
// 환생
const rbGain=()=>Math.max(0,Math.floor(S.stage/2)-5);
function rebirth(){if(S.stage<20||mode!='n')return;if(!RBC){RBC=setTimeout(()=>{RBC=0;R()},3000);R();return}clearTimeout(RBC);RBC=0;const g=rbGain();S.x.so+=g;S.x.rb++;S.x.best=Math.max(S.x.best,S.stage);
S.stage=Math.max(1,Math.floor(S.x.best*.3));S.sk=0;S.gold=0;S.up={a:0,d:0,c:0,s:0,m:0,n:0,h:0,j:0};q=[];mode='n';fill();sfx('win');toast('🔄 환생! 영혼석 +'+g+' → '+S.stage+'단계에서 시작');save();R()}
function rebirthH(){const g=rbGain(),ok=S.stage>=20&&mode=='n';return `<h3>🔄 환생</h3><p>환생하면 <b>단계·골드·능력치 강화</b>가 초기화되고 <b>영혼석</b>을 얻어요.<br>영혼석 1개당 공격력·골드 <b>+5%</b> (영구).<br>보석·장비·뽑기 레벨·강화·도감·업적·탑 기록은 그대로예요.<br>환생 후엔 최고 단계의 30% 지점에서 다시 시작해요.</p><div class="row"><span>현재 <b>${S.stage}</b>단계 · 최고 <b>${bst()}</b>단계 · 환생 ${S.x.rb}회<br>보유 영혼석 <b>${S.x.so}</b>개 (공격력·골드 +${S.x.so*5}%)</span></div><div class="row"><span>지금 환생하면 영혼석 <b style="color:#ffd34d">+${g}</b><br><small>20단계부터 가능 · 획득량 = 단계÷2 − 5</small></span><button class="b" ${ok?'':'disabled'} onclick="rebirth()">${RBC?'정말 환생! (한 번 더)':'환생하기'}</button></div><p><small>총 보너스: 영혼석 ×${(1+.05*S.x.so).toFixed(2)} · 도감 ×${(1+.01*CXN).toFixed(2)} · 세트 ×${setM().toFixed(2)}</small></p>`}
// 강화/각성
const enCost=(g,l)=>Math.round(20*(l+1)*(1+g*.3));
function enRow(t){const g=S.eq[t];if(g<0)return '';const lv=S.x.en[t][g],mx=lv>=15,need=lv>=10?3:1,have=Math.max(0,S.inv[t][g]-1),cost=enCost(g,lv),rate=lv<5?100:lv<10?70:40,ok=!mx&&have>=need&&S.gems>=cost;
return `<div class="row" style="background:#0d1230;border-radius:8px;padding:10px"><span><b style="color:${col(g)}">${GR[g]} ${TY[t].nm[g]}</b> <span style="color:#ffd34d">${lv>=10?'🌟각성 ★'+(lv-10)+' ':''}+${lv}</span> <small>(효과 ×${enM(t,g).toFixed(2)})</small><br><small>${mx?'최대 강화 달성':(lv>=10?'🌟각성':'강화')+' 성공률 '+rate+'% · 재료: 같은 장비 '+need+'개 (여분 '+have+') · 💎'+cost}</small></span><button class="b" ${ok?'':'disabled'} onclick="enh('${t}')">${mx?'MAX':lv>=10?'각성':'강화'}</button></div>`}
function enh(t){const g=S.eq[t];if(g<0)return;const lv=S.x.en[t][g],need=lv>=10?3:1,cost=enCost(g,lv),rate=lv<5?100:lv<10?70:40;if(lv>=15||S.inv[t][g]-1<need||S.gems<cost)return;S.gems-=cost;S.inv[t][g]-=need;
if(Math.random()*100<rate){S.x.en[t][g]++;sfx('win');toast(lv+1>=11?'🌟 각성 성공! +'+(lv+1):'✨ 강화 성공! +'+(lv+1))}else{sfx('lose');toast('💥 강화 실패… 재료가 사라졌어요')}R()}
function setTxt(){const e=S.eq;if(e.w<0||e.a<0||e.p<0)return '<p><small>🧩 세트 효과: 무기·갑옷·펫을 모두 장착하면 공격력·골드 보너스!</small></p>';const m=Math.min(e.w,e.a,e.p);return `<p>🧩 <b>세트 효과 ×${setM().toFixed(2)}</b> <small>(최저 등급 ${GR[m]} 기준 +${(m+1)*5}%${e.w==e.a&&e.a==e.p?' · 🌈 같은 등급 일치 ×1.5':''})</small></p>`}
function EXT(p){return p=='c'?contentH():p=='x'?codexH():p=='r'?rebirthH():''}

setInterval(()=>{if(T>2)daily();cxUpdate();hud();badge();R()},300);cxUpdate();hud();
(()=>{let el=Math.min((Date.now()-S.last)/1000,7200);if(el>60){let g=el*.2*gpk();S.gold+=g;setTimeout(()=>toast('오프라인 보상 💰'+fmt(g)),500)}})();
</script></body></html>
